# Cut a release by tagging main HEAD. No version-bump PR.
# Pushing the tag with GITHUB_TOKEN does not start other workflows, so we
# explicitly dispatch release.yml (same pattern as the old auto-tag flow).
name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.8.7-alpha.2) — tags main as v<version>'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  cut:
    name: Tag main and dispatch release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if ! echo "$VERSION" | grep -qP '^\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?$'; then
            echo "::error::Invalid version format: ${VERSION}"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create tag and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed ${TAG}"
          echo "Dispatching release workflow for ${TAG}"
          gh workflow run release.yml --field tag="$TAG"
